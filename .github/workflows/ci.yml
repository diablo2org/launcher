name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.26

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Covers the spec: schemas, examples, every listing entry in servers/
      # and that servers/index.json is up to date.
      - name: Go tests
        run: go test ./internal/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/...

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        run: |
          wails3 generate bindings -clean=true -ts
          cd frontend
          npm run check

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # A per-user installer, so installing needs no administrator rights.
      # Tagged builds carry the tag as their version; others report "dev".
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          if ($version) { wails3 package INSTALL_SCOPE=user VERSION=$version } else { wails3 package INSTALL_SCOPE=user }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: d2pack for server teams
        run: go build -trimpath -ldflags "-s -w" -o bin/d2pack.exe ./cmd/d2pack

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-Item bin/launcher.exe, bin/d2pack.exe) + @(Get-ChildItem build/windows/nsis/*-installer.exe)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii bin/SHA256SUMS.txt
          Get-Content bin/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: |
            bin/launcher.exe
            bin/d2pack.exe
            bin/SHA256SUMS.txt
            build/windows/nsis/*-installer.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*-installer.exe
            dist/**/d2pack.exe
            dist/**/SHA256SUMS.txt
          generate_release_notes: true
