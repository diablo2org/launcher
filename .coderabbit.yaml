# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB

reviews:
  # Post every finding as an inline comment, not just the most important.
  profile: assertive
  poem: false
  in_progress_fortune: false

  path_filters:
    - "!go.sum"
    - "!frontend/package-lock.json"
    # Generated by `go run ./cmd/listing` from the profiles beside it.
    - "!servers/index.json"

  path_instructions:
    - path: "**/*.go"
      instructions: |
        Profiles, manifests and plan files are untrusted input. Check that
        paths can't escape their folder (.., absolute paths, drive letters,
        symlinks, junctions, Windows reserved names, case-only clashes), that
        URLs stay on the profile's hosts, and that downloads are checked by
        size and SHA-256 before use. The launcher runs on Windows first:
        watch for file locking, CRLF, and path case.
    - path: "internal/launch/**"
      instructions: |
        This code writes to the Windows registry and starts Game.exe. Flag
        any launch argument that isn't from the profile's allowedFlags, and
        any registry write outside the Battle.net and Diablo II keys.
    - path: "servers/*.json"
      instructions: |
        A server profile submitted for listing. Check it against
        docs/SPEC.md: https only, hosts the server plausibly owns, and no
        flags or settings that would surprise a player.
    - path: "frontend/**"
      instructions: |
        Svelte 5 with runes and TypeScript. Bindings under frontend/bindings
        are generated by Wails and not committed.

  pre_merge_checks:
    # Go documents exported names, which golangci-lint checks; a coverage
    # target over every function doesn't fit.
    docstrings:
      mode: "off"

  auto_review:
    enabled: true
    drafts: false
